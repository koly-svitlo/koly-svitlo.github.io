name: Оновити графік

on:
  schedule:
    - cron: "7,37 * * * *"   # кожні 30 хвилин
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Надіслати поточний графік у Telegram (перевірка)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Read ztoe.com.ua
        run: node scripts/update.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
      - name: Commit data.json
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Оновлення графіка"
            git pull --rebase
            git push
          fi
